name = "ai-bridge"
main = "src/index.js"
compatibility_date = "2025-06-01"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Secrets (set with `wrangler secret put` or in the Cloudflare dashboard):
#   BRIDGE_KEY    random string that goes in every URL; keeps strangers out
#   GITHUB_TOKEN  fine-grained GitHub token with Contents + Pull requests: read/write
